apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-green
  labels:
    app: aceest-fitness-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness-green
  template:
    metadata:
      labels:
        app: aceest-fitness-green
    spec:
      containers:
        - name: aceest-fitness
          image: pallab017/aceest-fitness:2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
