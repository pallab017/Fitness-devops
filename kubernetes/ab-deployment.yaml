apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-variant-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness-variant-a
  template:
    metadata:
      labels:
        app: aceest-fitness-variant-a
    spec:
      containers:
      - name: fitness
        image: pallab017/aceest-fitness:2
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-variant-a-service
spec:
  type: NodePort
  selector:
    app: aceest-fitness-variant-a
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-variant-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness-variant-b
  template:
    metadata:
      labels:
        app: aceest-fitness-variant-b
    spec:
      containers:
      - name: fitness
        image: pallab017/aceest-fitness:2
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-variant-b-service
spec:
  type: NodePort
  selector:
    app: aceest-fitness-variant-b
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30082
